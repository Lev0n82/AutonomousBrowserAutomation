<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Autonomous Browser Automation</title>
  <desc id="description">Ollama-powered browser agents for Chrome, Edge, Firefox, and Comet.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a2d"/>
      <stop offset=".48" stop-color="#17474a"/>
      <stop offset="1" stop-color="#2c7772"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#92e2d7"/>
      <stop offset="1" stop-color="#d8fff8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#071719" flood-opacity=".42"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b7eee6" stroke-opacity=".065"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#background)"/>
